name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Firebase config check
        run: |
          if [ -f android/app/google-services.json ]; then
            echo "google-services.json found - building with Firebase"
          else
            echo "::warning::android/app/google-services.json is missing. The APK will open, but login/chat/status need your Firebase config (Firebase Console > Project settings > Android app com.mmessage.app > download google-services.json)."
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: |
          chmod +x android/gradlew
          flutter pub get

      - name: Analyze (report only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build release APKs (one per CPU type)
        run: flutter build apk --release --split-per-abi

      - name: Collect APKs
        run: |
          ls -la build/app/outputs/flutter-apk/
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/m-message.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/m-message-armeabi-v7a.apk
          ls -la dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: m-message-apk
          path: dist/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: M Message v1.0.${{ github.run_number }}
          body: |
            M Message APK built by GitHub Actions (run ${{ github.run_number }}, commit ${{ github.sha }}).
            - m-message.apk: most phones (arm64-v8a)
            - m-message-armeabi-v7a.apk: older 32-bit phones
          files: dist/*.apk
          make_latest: true
